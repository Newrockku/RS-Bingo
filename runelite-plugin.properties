# Plugin Hub manifest. Read by the hub when it builds this repo; side-loading for
# your own use ignores it.
#
# The description is what people read before installing, so it says up front that
# the plugin talks to rs-bingo.com and that submitting uploads a screenshot. Both
# are the sort of thing a reviewer — and a player — should not have to discover
# from the source.
# "standard" means the hub builds this with its own build.gradle rather than the
# one in this repo. It is the mode the hub asks for whenever a plugin has no
# dependencies of its own, and it is what gets a submission reviewed fastest.
#
# This property is not optional: the packager rejects a submission that leaves it
# out, before any of the build runs. The message it gives ("build" must be set)
# never reaches the Gradle log, so the failure looks like a build error with no
# build error in it.
#
# Keeping it on "standard" means this repo's build.gradle must stay free of
# anything the plugin actually needs to compile — it is a local development
# convenience only. See DEVELOPING.md.
build=standard
displayName=RS-Bingo
author=Newrockku
description=Follow an rs-bingo.com bingo event from the sidebar. Shows your team's board, tile checklists, point rates, per-player progress and the event standings. Optionally submit drops without leaving the client: picking an item captures a screenshot and uploads it to rs-bingo.com for review. Requires an event code; all data comes from rs-bingo.com.
tags=bingo,clan,event,board,team,competition
plugins=com.rsbingo.RsBingoPlugin
